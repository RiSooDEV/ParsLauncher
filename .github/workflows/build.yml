name: Build Pars Launcher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows build (launcher + installer)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Sync Rust dependencies with npm versions
        run: |
          Push-Location src-tauri
          cargo update
          Pop-Location
          if (Test-Path "installer/src-tauri/Cargo.toml") {
            Push-Location installer/src-tauri
            cargo update
            Pop-Location
          }

      - name: Build launcher (frontend + Rust + NSIS installer)
        run: pnpm tauri build --bundles nsis

      - name: Build WebSetup installer (embeds launcher exe)
        run: |
          & "installer/build.ps1"
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Collect outputs
        run: |
          New-Item -ItemType Directory -Force -Path "dist-out" | Out-Null
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $nsis.FullName "dist-out/" -Force
          Copy-Item "src-tauri/target/release/Pars Launcher.exe" "dist-out/" -Force
          Copy-Item "installer/Pars Launcher WebSetup.exe" "dist-out/" -Force -ErrorAction SilentlyContinue
          Copy-Item "installer/Pars Launcher WebSetup.exe.sha256" "dist-out/" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "dist-out" | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$h  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
          Get-ChildItem "dist-out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pars-launcher-windows
          path: dist-out/
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-out/*.exe
            dist-out/*.sha256
          generate_release_notes: true
